# Modeled end-use axis (`e`) and optional detailed alias axis (`ed`).
dimension:
  name: end_use
  symbol: e

# Optional detailed dimension for future disaggregation and mapping tables.
end_use_detailed_dimension:
  name: end_use_detailed
  symbol: ed

# Canonical modeled end-use labels used in demand shares and stock outputs.
end_uses:
  - construction
  - computers_and_precision_instruments
  - electrical_equipment
  - machinery_and_equipment
  - motor_vehicles_trailers_and_semi_trailers
  - other_transport_equipment
  - products_nec

# Reserved for expanded MFA system definition.
# Keep empty unless a mapping in end_use_detail.yml is actively used.
end_use_detailed: []
