# Canonical shared run profile.
# Keep defaults here broad and reusable; scenario-specific behavior should stay in scenario files.
name: "Tin–Zinc–Nickel | EU27–China–RoW | Coupled SD–dMFA (core)"

# Includes are merged into this run profile.
# Paths are relative to this file.
includes:
  time: ../time.yml
  regions: ../regions.yml
  materials: ../materials.yml
  end_uses: ../end_use.yml
  stages: ../stages.yml
  qualities: ../qualities.yml
  trade: ../trade.yml
  trade_od: ../trade.yml
  coupling: ../coupling.yml
  indicators: ../indicators.yml
  variables: ../../registry/variable_registry.yml

# Temporal values can be:
# - scalar: capacity_expansion_gain: 0.26
# - year-gated: {start_year: 2025, value: 0.34, before: 0.26}
# - full timeseries: [0.50, 0.50, 0.52, 0.55]
sd_parameters:
  # Price loop:
  # scarcity_multiplier -> price_ratio -> demand response and collection response.
  price_base: 1.0
  price_scarcity_sensitivity: 0.55
  demand_price_elasticity: 0.1
  # Coupling stress multiplier:
  # 1 + gain_service * service_stress + gain_circular * circular_stress
  coupling_service_stress_gain: 3.5
  coupling_circular_supply_stress_gain: 0.8
  coupling_signal_smoothing: 0.5
  coupling_signal_smoothing_strategic: 0.35
  service_stress_signal_cap: 0.60
  coupling_stress_multiplier_cap: 3.0
  collection_price_response_gain: 0.22
  collection_multiplier_min: 0.88
  collection_multiplier_max: 1.10
  collection_multiplier_lag_years: 4.0
  capacity_envelope_initial: 1.0
  capacity_envelope_min: 0.8
  capacity_envelope_max: 1.45
  capacity_expansion_gain: 0.26
  capacity_retirement_gain: 0.04
  capacity_adjustment_lag_years: 4.5
  capacity_pressure_shortage_weight: 0.78
  bottleneck_scarcity_gain: 0.15
  bottleneck_collection_sensitivity: 0.08

# Ordered override rules by material/region.
# Matching rules are applied in list order before variant-level overrides.
sd_heterogeneity:
  - name: region_eu27
    regions: [EU27]
    sd_parameters:
      demand_price_elasticity: 0.12
      coupling_signal_smoothing: 0.55
  - name: region_china
    regions: [China]
    sd_parameters:
      demand_price_elasticity: 0.08
      coupling_signal_smoothing: 0.45
  - name: material_nickel
    materials: [nickel]
    sd_parameters:
      coupling_service_stress_gain: 4.0
  - name: nickel_eu27_specific
    materials: [nickel]
    regions: [EU27]
    sd_parameters:
      coupling_service_stress_gain: 4.5

# Baseline dMFA controls used unless scenario overrides apply.
mfa_parameters:
  fabrication_yield: 0.9516291043157408
  collection_rate: 0.598632813775853
  recycling_yield: 0.6204694683919402
  reman_yield: 0.7168092328464711
  mass_balance_tolerance: 1.0e-8

# Strategy controls for routing, stock release, and reserve policy.
strategy:
  reman_yield: 0.6881412051746674
  lifetime_multiplier: 1.319713009082212
  refinery_stockpile_release_rate: 0.25
  new_scrap_to_secondary_share: 0.75
  strategic_reserve_enabled: false
  strategic_reserve_target_coverage_years: 0.5
  strategic_reserve_fill_gain: 0.5
  strategic_reserve_release_gain: 1.0
  strategic_reserve_max_fill_rate: 0.15
  strategic_reserve_max_release_rate: 0.25
  strategic_reserve_fill_price_threshold: 1.0
  strategic_reserve_release_price_threshold: 1.1
  strategic_reserve_fill_service_threshold: 0.05
  strategic_reserve_release_service_threshold: 0.15

# Transition policy controls adoption-driven uplifts and relief.
transition_policy:
  enabled: false
  start_year: 2025
  adoption_target: 0.0
  adoption_lag_years: 4.0
  compliance_delay_years: 0.0
  demand_intensity_reduction_max: 0.0
  collection_uplift_max: 0.0
  recycling_yield_uplift_max: 0.0
  capacity_expansion_gain_uplift: 0.0
  bottleneck_relief_max: 0.0

# Demand transformation decomposes demand into service activity and material intensity.
demand_transformation:
  enabled: false
  service_activity_source: service_activity
  material_intensity_source: material_intensity
  service_activity_multiplier: 1.0
  material_intensity_multiplier: 1.0
  efficiency_improvement: 0.0
  rebound_effect: 0.0
  transition_adoption_weight: 0.0
  min_demand_multiplier: 0.25
  max_demand_multiplier: 2.5
  normalize_exogenous: true

# Scenario profile CSVs can overlay variant values at runtime when enabled.
scenario_profiles:
  enabled: false
  csv_globs: []
  interpolation: linear
  apply_precedence: profile_overrides_variant
  emit_resolved_payload: true

# Shock dictionary defines channels available to scenario variants.
# `null` means no active event in the baseline.
shocks:
  demand_surge: null
  recycling_disruption: null
  primary_refined_output: null
  trade_refined_import_need_multiplier: null
  trade_concentrate_import_need_multiplier: null
  trade_scrap_import_need_multiplier: null
  trade_export_capacity_multiplier: null
  extraction_yield: null
  beneficiation_yield: null
  refining_yield: null
  sorting_yield: null
  collection_rate: null
  recycling_rate: null
  remanufacturing_rate: null
  disposal_rate: null
  strategic_fill_intent: null
  strategic_release_intent: null

variants:
  baseline:
    # Baseline is intentionally thin and inherits all defaults above.
    description: Reference pathway with exogenous demand, primary refined output anchor, endogenous trade channels, and routing rates as provided in input datasets.
    implementation:
      - No additional variant-level overrides.
      - Uses baseline mfa_parameters/strategy plus exogenous primary_refined_output, stage_yields_losses, collection_routing_rates, and endogenous OD trade channels when enabled.
