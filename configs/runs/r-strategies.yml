# Thin overlay for the R-strategies scenario pack.
# Keep this file focused on scenario/profile activation and small baseline deltas.
name: "Tin–Zinc–Nickel | EU27–China–RoW | Coupled SD–dMFA (R-strategies)"
# Inherit shared defaults from `_core.yml`.
extends: ./_core.yml

includes:
  # Load all R-strategy variants.
  scenarios: ../scenarios/r_strategies/*.yml

# Runtime profile ingestion for exogenous ramp CSVs.
scenario_profiles:
  enabled: true
  csv_globs:
    - ../../data/ramp_profiles/r_strategies/*.csv
  interpolation: linear
  apply_precedence: profile_overrides_variant
  emit_resolved_payload: true

strategy:
  # Small baseline delta for this run family.
  new_scrap_to_secondary_share: 0.85
