# Coupling mode between SD and dMFA.
# `loose_iterative` means both modules are solved repeatedly until signals stabilize.
mode: loose_iterative
# Hard cap on coupling iterations.
max_iter: 12
# Convergence threshold for max signal delta across iterations.
convergence_tol: 0.02
# `time_series` feeds yearly signals; `scalar_mean` uses reporting-window means.
feedback_signal_mode: time_series
# If true, feedback updates are applied only in reporting years.
feedback_on_report_years_only: true

# Signal wiring between modules.
# SD -> dMFA signals provide demand and reserve intents.
# dMFA -> SD signals provide stress and coverage feedback.
signals:
  sd_to_mfa:
    - desired_demand_t            # Exogenous desired demand, indexed by (year, material, region).
    - end_use_shares_te           # End-use split shares, indexed by (year, material, region, end_use).
    - strategic_fill_intent_t     # Reserve fill intent from SD policy loop.
    - strategic_release_intent_t  # Reserve release intent from SD policy loop.
  mfa_to_sd:
    - service_stress_t            # Formula: unmet_service / service_demand.
    - circular_supply_stress_t    # Formula: 1 - secondary_supply / (primary_supply + secondary_supply).
    - strategic_stock_coverage_years_t  # Formula: strategic_inventory_stock / service_demand.
notes:
  - "Loose iterative coupling only (no year-by-year co-simulation)."
  - "Raised max_iter for strategic reserve scenarios with larger coverage transients."
