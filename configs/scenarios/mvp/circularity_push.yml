# Scenario config: circularity_push
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: circularity_push
# Short plain-language summary used in reporting and run metadata.
description: Circularity-oriented strategy with stronger collection and higher secondary
  conversion performance.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Global improvements increase recycling/reman yields and lifetime multiplier.
- Exogenous ramps are defined inline under mfa_parameters/strategy keys using exogenous_ramp CSV references.
- EU27 nickel receives additional targeted collection and routing reinforcement.
# MFA-side physical levers (collection, yields, loss controls, and stock constraints).
mfa_parameters:
  collection_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
# Strategy levers: routing, reserve policy, stock-release, and lifetime multipliers.
strategy:
  recycling_yield:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
  lifetime_multiplier: 1.15
  reman_yield:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: eu27_nickel_priority
  # Material filter for this override item. Omit to match all materials.
  materials:
  - nickel
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  mfa_parameters:
    collection_rate:
      # Reads anchor points from profile CSV and expands to modeled years.
      exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
  strategy:
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    recycling_rate:
      # Reads anchor points from profile CSV and expands to modeled years.
      exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    remanufacturing_rate:
      # Reads anchor points from profile CSV and expands to modeled years.
      exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    disposal_rate:
      # Reads anchor points from profile CSV and expands to modeled years.
      exogenous_ramp: data/ramp_profiles/mvp/circularity_push.csv
