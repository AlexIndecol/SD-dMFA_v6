# Scenario config: strategic_reserve_build_release
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: strategic_reserve_build_release
# Short plain-language summary used in reporting and run metadata.
description: Strategic reserve stress-test with a pre-crisis accumulation phase and
  crisis-driven release phase.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Enables strategic reserve policy and targets short-run coverage build during low-stress
  years.
- Applies a later demand surge and intent multipliers to induce reserve drawdown response.
# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  coupling_signal_smoothing: 0.48
  coupling_signal_smoothing_strategic:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.45
  strategic_stock_coverage_years: 0.0
# Strategy levers: routing, reserve policy, stock-release, and lifetime multipliers.
strategy:
  strategic_reserve_enabled:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: true
  strategic_reserve_target_coverage_years:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.8
  strategic_reserve_fill_gain:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.7
  strategic_reserve_release_gain:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.7
  strategic_reserve_max_fill_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.2
  strategic_reserve_max_release_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.12
  strategic_reserve_fill_price_threshold:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 5.0
  strategic_reserve_release_price_threshold:
    # Activation year for this temporal override/event.
    start_year: 2040
    before: 5.0
    value: 1.3
  strategic_reserve_fill_service_threshold:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.0
  strategic_reserve_release_service_threshold:
    # Activation year for this temporal override/event.
    start_year: 2040
    before: 1.0
    value: 0.25
  refinery_stockpile_release_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.2
# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  trade_refined_import_need_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 15
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.15
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2040
    # Event duration in years (inclusive step window).
    duration_years: 20
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.3
  strategic_fill_intent:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 15
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.1
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: reserve_damping_non_priority_regions
  # Region filter for this override item. Omit to match all regions.
  regions:
  - China
  - RoW
  strategy:
    strategic_reserve_target_coverage_years:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.2
    strategic_reserve_fill_gain:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.2
    strategic_reserve_release_gain:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.3
    strategic_reserve_max_fill_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.05
    strategic_reserve_max_release_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.1
# Override item: define scope first, then local block deltas.
- name: reserve_damping_eu27_non_nickel
  # Material filter for this override item. Omit to match all materials.
  materials:
  - tin
  - zinc
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  strategy:
    strategic_reserve_target_coverage_years:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.25
    strategic_reserve_fill_gain:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.2
    strategic_reserve_release_gain:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.3
    strategic_reserve_max_fill_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
