# Scenario config: import_squeeze_circular_ramp
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: import_squeeze_circular_ramp
# Short plain-language summary used in reporting and run metadata.
description: External primary import squeeze followed by delayed circularity and policy ramp
  to test resilience recovery.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
  - Stress window (2025-2035) reduces primary output and net imports while demand pressure remains elevated.
  - Response window (from 2028) activates transition-policy adoption and demand-transformation efficiency.
  - Exogenous demand-transformation ramps are encoded inline as exogenous_ramp CSV references under demand_transformation keys.
  - Recovery is assessed through bottleneck relaxation, service stabilization, and circular-supply strengthening.

# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  capacity_pressure_shortage_weight:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.82
  bottleneck_scarcity_gain:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.24
  bottleneck_collection_sensitivity:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.12

# Transition-policy loop controls adoption/compliance dynamics and derived uplifts.
transition_policy:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  # Activation year for this temporal override/event.
  start_year: 2028
  adoption_target: 0.72
  adoption_lag_years: 5.0
  compliance_delay_years: 1.0
  demand_intensity_reduction_max: 0.14
  collection_uplift_max: 0.18
  recycling_yield_uplift_max: 0.1
  capacity_expansion_gain_uplift: 0.16
  bottleneck_relief_max: 0.28

# Demand transformation decomposes demand into service-activity and material-intensity channels.
demand_transformation:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  service_activity_source: service_activity
  material_intensity_source: material_intensity
  service_activity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.05
  material_intensity_multiplier:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/mvp/import_squeeze_circular_ramp.csv
  efficiency_improvement:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/mvp/import_squeeze_circular_ramp.csv
  rebound_effect:
    # Activation year for this temporal override/event.
    start_year: 2028
    value: 0.17
  transition_adoption_weight: 0.7
  min_demand_multiplier: 0.65
  max_demand_multiplier: 1.25

# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 11
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.15
  primary_refined_output:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 11
    # Multiplies the baseline channel while the event is active.
    multiplier: 0.88
  trade_refined_import_need_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 11
    # Multiplies the baseline channel while the event is active.
    multiplier: 0.68

# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
  - name: nickel_eu27_deeper_import_squeeze
    materials: [nickel]
    regions: [EU27]
    shocks:
      primary_refined_output:
        # Activation year for this temporal override/event.
        start_year: 2025
        # Event duration in years (inclusive step window).
        duration_years: 11
        # Multiplies the baseline channel while the event is active.
        multiplier: 0.82
      trade_refined_import_need_multiplier:
        # Activation year for this temporal override/event.
        start_year: 2025
        # Event duration in years (inclusive step window).
        duration_years: 11
        # Multiplies the baseline channel while the event is active.
        multiplier: 0.55
    transition_policy:
      adoption_target: 0.8
      collection_uplift_max: 0.24
      capacity_expansion_gain_uplift: 0.2
      bottleneck_relief_max: 0.34
    demand_transformation:
      material_intensity_multiplier:
        # Reads anchor points from profile CSV and expands to modeled years.
        exogenous_ramp: data/ramp_profiles/mvp/import_squeeze_circular_ramp.csv
      efficiency_improvement:
        # Activation year for this temporal override/event.
        start_year: 2028
        value: 0.13
  - name: row_slower_policy_ramp
    regions: [RoW]
    transition_policy:
      adoption_target: 0.58
      adoption_lag_years: 6.5
    demand_transformation:
      material_intensity_multiplier:
        # Activation year for this temporal override/event.
        start_year: 2028
        value: 0.94
