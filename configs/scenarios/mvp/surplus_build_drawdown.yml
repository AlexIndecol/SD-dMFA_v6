# Scenario config: surplus_build_drawdown
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: surplus_build_drawdown
# Short plain-language summary used in reporting and run metadata.
description: Buffer activation stress-test with circular oversupply in an early build
  phase and natural drawdown after shocks expire.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- 'Build phase (2025-2049): reduced demand plus stronger collection and routing to
  recycling/remanufacturing.'
- 'Drawdown phase (2050+): temporary shocks end, demand returns to baseline, and stored
  circular material is released according to the buffer release rate.'
# Strategy levers: routing, reserve policy, stock-release, and lifetime multipliers.
strategy:
  recycling_yield:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.95
  reman_yield:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.95
  refinery_stockpile_release_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.12
# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  collection_multiplier_min:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.0
  collection_multiplier_max:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 2.0
  collection_multiplier_lag_years:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.5
# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 25
    # Multiplies the baseline channel while the event is active.
    multiplier: 0.75
  collection_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 25
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.6
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  recycling_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 25
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.5
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  remanufacturing_rate:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 25
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.35
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: nickel_eu27_surplus_priority
  # Material filter for this override item. Omit to match all materials.
  materials:
  - nickel
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  strategy:
    refinery_stockpile_release_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.1
  shocks:
    collection_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 25
      # Multiplies the baseline channel while the event is active.
      multiplier: 1.7
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    recycling_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 25
      # Multiplies the baseline channel while the event is active.
      multiplier: 1.6
