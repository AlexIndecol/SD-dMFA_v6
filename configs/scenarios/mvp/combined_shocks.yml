# Scenario config: combined_shocks
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: combined_shocks
# Short plain-language summary used in reporting and run metadata.
description: Global demand stress plus region/material-specific supply and circularity
  shocks.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Global demand_surge applies to all slices during 2025-2039.
- Regional/material overrides add layered stress without exceeding dedicated disruption scenario severity.
# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 15
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.45
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: nickel_eu27_joint_stress
  # Material filter for this override item. Omit to match all materials.
  materials:
  - nickel
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  shocks:
    recycling_disruption:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 15
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.3
    trade_refined_import_need_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 15
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.7
# Override item: define scope first, then local block deltas.
- name: zinc_china_collection_stress
  # Material filter for this override item. Omit to match all materials.
  materials:
  - zinc
  # Region filter for this override item. Omit to match all regions.
  regions:
  - China
  shocks:
    collection_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 15
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.94
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    recycling_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 15
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.92
    # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
    remanufacturing_rate:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 15
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.96
