# Scenario config: capacity_crunch_recovery
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: capacity_crunch_recovery
# Short plain-language summary used in reporting and run metadata.
description: Targeted crunch-recovery stress test for endogenous capacity-scarcity-price dynamics.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Stress window (2025-2042) combines higher demand with tighter primary availability.
- Activates bottleneck amplification and collection throttle channels.
- Shocks end after window; recovery is endogenous through capacity-envelope dynamics.
# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  capacity_expansion_gain: 0.34
  capacity_adjustment_lag_years: 4.0
  capacity_pressure_shortage_weight: 0.82
  bottleneck_scarcity_gain: 0.35
  bottleneck_collection_sensitivity: 0.18
  collection_price_response_gain: 0.3
# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 18
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.35
  primary_refined_output:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 18
    # Multiplies the baseline channel while the event is active.
    multiplier: 0.9
  trade_refined_import_need_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 18
    # Multiplies the baseline channel while the event is active.
    multiplier: 0.72
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: nickel_eu27_deeper_crunch
  # Material filter for this override item. Omit to match all materials.
  materials:
  - nickel
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  shocks:
    demand_surge:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 18
      # Multiplies the baseline channel while the event is active.
      multiplier: 1.5
    trade_refined_import_need_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      # Event duration in years (inclusive step window).
      duration_years: 18
      # Multiplies the baseline channel while the event is active.
      multiplier: 0.6
  sd_parameters:
    bottleneck_scarcity_gain: 0.45
    bottleneck_collection_sensitivity: 0.22
