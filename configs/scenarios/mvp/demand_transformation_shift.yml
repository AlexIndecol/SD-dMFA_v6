# Scenario config: demand_transformation_shift
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: demand_transformation_shift
# Short plain-language summary used in reporting and run metadata.
description: Demand-transformation stress profile with stronger service growth offset by intensity decline and efficiency gains.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
  - Activates exogenous demand decomposition into service activity and material intensity channels.
  - Adds reporting-phase efficiency improvement with bounded rebound.
  - Keeps transition policy disabled to isolate demand-transformation loop behavior.

# Demand transformation decomposes demand into service-activity and material-intensity channels.
demand_transformation:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  service_activity_source: service_activity
  material_intensity_source: material_intensity
  service_activity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.10
  material_intensity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.88
  efficiency_improvement:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.12
  rebound_effect: 0.20
  transition_adoption_weight: 0.0
  min_demand_multiplier: 0.65
  max_demand_multiplier: 1.40

# Shock events use step parameters: start_year, duration_years, multiplier.
shocks:
  demand_surge:
    # Activation year for this temporal override/event.
    start_year: 2025
    # Event duration in years (inclusive step window).
    duration_years: 10
    # Multiplies the baseline channel while the event is active.
    multiplier: 1.10

# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
  - name: china_service_acceleration
    regions: [China]
    demand_transformation:
      service_activity_multiplier:
        # Activation year for this temporal override/event.
        start_year: 2025
        value: 1.16
      efficiency_improvement:
        # Activation year for this temporal override/event.
        start_year: 2025
        value: 0.10
  - name: eu27_intensity_push
    regions: [EU27]
    demand_transformation:
      material_intensity_multiplier:
        # Activation year for this temporal override/event.
        start_year: 2025
        value: 0.82
      efficiency_improvement:
        # Activation year for this temporal override/event.
        start_year: 2025
        value: 0.14
