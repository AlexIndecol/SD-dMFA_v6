# Scenario config: r36_lifetime_reman_high
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: r36_lifetime_reman_high
# Short plain-language summary used in reporting and run metadata.
description: High-intensity R3/R6 pathway with ambitious lifetime extension and strong
  remanufacturing loops.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Apply high lifetime extension multiplier.
- Shift strongly toward remanufacturing while maintaining normalized routing shares.
- Use high remanufacturing process yield.
# Transition-policy loop controls adoption/compliance dynamics and derived uplifts.
transition_policy:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  # Activation year for this temporal override/event.
  start_year: 2026
  adoption_target: 0.78
  adoption_lag_years: 4.5
  compliance_delay_years: 1.0
  demand_intensity_reduction_max: 0.08
  collection_uplift_max: 0.14
  recycling_yield_uplift_max: 0.1
  capacity_expansion_gain_uplift: 0.14
  bottleneck_relief_max: 0.22
# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  capacity_expansion_gain:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  bottleneck_scarcity_gain:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  bottleneck_collection_sensitivity:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
# Strategy levers: routing, reserve policy, stock-release, and lifetime multipliers.
strategy:
  lifetime_multiplier:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  reman_yield:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  recycling_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  remanufacturing_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  disposal_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r36_profiles.csv
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: eu27_r36_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  transition_policy:
    adoption_target: 0.85
    collection_uplift_max: 0.17
    bottleneck_relief_max: 0.26
# Override item: define scope first, then local block deltas.
- name: china_r36_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - China
  transition_policy:
    adoption_target: 0.78
# Override item: define scope first, then local block deltas.
- name: row_r36_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - RoW
  transition_policy:
    adoption_target: 0.72
