# Scenario config: r02_demand_efficiency_high
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: r02_demand_efficiency_high
# Short plain-language summary used in reporting and run metadata.
description: High-intensity R0/R2 pathway with strong demand reduction and high material-efficiency
  gains.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Activate demand-transformation with strong intensity reduction and efficiency gains.
- Raise fabrication yield to represent high material efficiency.
- Use hybrid regional pattern with strongest reductions in EU27 and moderated RoW
  transition.
# MFA-side physical levers (collection, yields, loss controls, and stock constraints).
mfa_parameters:
  fabrication_yield:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.97
# Demand transformation decomposes demand into service-activity and material-intensity channels.
demand_transformation:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  service_activity_source: service_activity
  material_intensity_source: material_intensity
  service_activity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.99
  material_intensity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.84
  efficiency_improvement:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.12
  rebound_effect: 0.15
  transition_adoption_weight: 0.0
  min_demand_multiplier: 0.55
  max_demand_multiplier: 1.05
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: eu27_r02_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  mfa_parameters:
    fabrication_yield:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.975
  demand_transformation:
    service_activity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.98
    material_intensity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.81
    efficiency_improvement:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.14
# Override item: define scope first, then local block deltas.
- name: china_r02_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - China
  mfa_parameters:
    fabrication_yield:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.97
  demand_transformation:
    service_activity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 1.01
    material_intensity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.84
    efficiency_improvement:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.11
# Override item: define scope first, then local block deltas.
- name: row_r02_high
  # Region filter for this override item. Omit to match all regions.
  regions:
  - RoW
  mfa_parameters:
    fabrication_yield:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.967
  demand_transformation:
    service_activity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 1.02
    material_intensity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.86
    efficiency_improvement:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.1
