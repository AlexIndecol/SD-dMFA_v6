# Scenario config: r79_recovery_loops_medium
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: r79_recovery_loops_medium
# Short plain-language summary used in reporting and run metadata.
description: Medium-intensity R7-R9 pathway with stronger collection systems and recycling
  loop performance.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Strengthen collection return systems and sorting performance through gradual ramps.
- Raise recycling process yield and recycling routing share.
- Increase manufacturing scrap loop closure toward near-closed-loop operation.
# SD loop tuning: scarcity-price-demand feedback and capacity/bottleneck behavior.
sd_parameters:
  collection_price_response_gain:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  bottleneck_collection_sensitivity:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
# MFA-side physical levers (collection, yields, loss controls, and stock constraints).
mfa_parameters:
  collection_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  sorting_yield:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
# Strategy levers: routing, reserve policy, stock-release, and lifetime multipliers.
strategy:
  recycling_yield:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  recycling_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  remanufacturing_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  # Routing-triad note: keep recycling + remanufacturing + disposal normalized.
  disposal_rate:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
  new_scrap_to_secondary_share:
    # Reads anchor points from profile CSV and expands to modeled years.
    exogenous_ramp: data/ramp_profiles/r_strategies/r79_profiles.csv
