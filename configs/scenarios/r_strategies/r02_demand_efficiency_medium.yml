# Scenario config: r02_demand_efficiency_medium
# Practical reading order: implementation -> global blocks -> dimension_overrides.
# Keep overrides minimal and aligned with the mechanism being tested.
name: r02_demand_efficiency_medium
# Short plain-language summary used in reporting and run metadata.
description: Medium-intensity R0/R2 pathway with stronger demand reduction and fabrication
  efficiency improvements.
# Mechanism checklist. These bullets should match the actual overrides below.
implementation:
- Activate demand-transformation with medium service/activity-intensity shift and
  efficiency gains.
- Increase fabrication yield to capture better material use efficiency.
- Apply hybrid regional differentiation (EU27 higher ambition, RoW softer transition).
# MFA-side physical levers (collection, yields, loss controls, and stock constraints).
mfa_parameters:
  fabrication_yield:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.955
# Demand transformation decomposes demand into service-activity and material-intensity channels.
demand_transformation:
  enabled:
    # Activation year for this temporal override/event.
    start_year: 2020
    value: true
    before: false
  service_activity_source: service_activity
  material_intensity_source: material_intensity
  service_activity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 1.0
  material_intensity_multiplier:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.9
  efficiency_improvement:
    # Activation year for this temporal override/event.
    start_year: 2025
    value: 0.08
  rebound_effect: 0.18
  transition_adoption_weight: 0.0
  min_demand_multiplier: 0.65
  max_demand_multiplier: 1.1
# Slice-targeted overrides. Matching items are applied in the listed order.
dimension_overrides:
# Override item: define scope first, then local block deltas.
- name: eu27_r02_medium
  # Region filter for this override item. Omit to match all regions.
  regions:
  - EU27
  mfa_parameters:
    fabrication_yield:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.96
  demand_transformation:
    service_activity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.99
    material_intensity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.88
    efficiency_improvement:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.09
# Override item: define scope first, then local block deltas.
- name: china_r02_medium
  # Region filter for this override item. Omit to match all regions.
  regions:
  - China
  mfa_parameters:
    fabrication_yield:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.955
  demand_transformation:
    service_activity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 1.02
    material_intensity_multiplier:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.9
    efficiency_improvement:
      # Activation year for this temporal override/event.
      start_year: 2025
      value: 0.075
# Override item: define scope first, then local block deltas.
- name: row_r02_medium
