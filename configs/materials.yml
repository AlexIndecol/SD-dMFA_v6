# Canonical material dimension used across SD, dMFA, scenarios, and registry inputs.
dimension:
  name: material
  symbol: m

# Keep material names stable; scenario filters and CSV rows depend on exact ids.
materials:
  - name: tin
    # Reporting unit expected in most outputs and exogenous drivers.
    unit: t
  - name: zinc
    unit: t
  - name: nickel
    unit: t
