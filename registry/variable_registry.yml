# Exogenous variable registry.
# Each entry defines where data lives and how validators should interpret its schema.
# Required fields per entry: `path`, `required`, `columns`.
# Optional fields: `unit`, `constraints`, `notes`.

# Desired final demand entering SD before behavioral response.
final_demand:
  path: data/exogenous/final_demand.csv
  required: true
  columns: [year, material, region, value]
  unit: t_per_year

# End-use split of demand by (year, material, region, end_use).
# Guardrail: shares should normalize to 1 within each (year, material, region).
end_use_shares:
  path: data/exogenous/end_use_shares.csv
  required: true
  columns: [year, material, region, end_use, value]
  unit: share
  constraints:
    - "nonnegative"
    - "normalize_within_year_material_region"

# Domestic primary refined output by slice.
primary_refined_output:
  path: data/exogenous/primary_refined_output.csv
  required: true
  columns: [year, material, region, value]
  unit: t_per_year
  notes:
    - "Domestic primary refined metal output."
    - "Refining-anchor input for primary availability."

# Yield/loss controls used to reconstruct upstream throughput.
# Guardrail examples:
# - yields in [0,1]
# - sorting_reject_to_disposal_share + sorting_reject_to_sysenv_share = 1
stage_yields_losses:
  path: data/exogenous/stage_yields_losses.csv
  required: true
  columns:
    - year
    - material
    - region
    - extraction_yield
    - beneficiation_yield
    - refining_yield
    - sorting_yield
    - extraction_loss_to_sysenv_share
    - beneficiation_loss_to_sysenv_share
    - refining_loss_to_sysenv_share
    - sorting_reject_to_disposal_share
    - sorting_reject_to_sysenv_share
  unit: share
  constraints:
    - "0 <= all yields/shares <= 1"
    - "sorting_reject_to_disposal_share + sorting_reject_to_sysenv_share = 1 per (year, material, region)"

# End-of-life routing triad.
# Guardrail formula:
# recycling_rate + remanufacturing_rate + disposal_rate = 1
collection_routing_rates:
  path: data/exogenous/collection_routing_rates.csv
  required: true
  columns: [year, material, region, recycling_rate, remanufacturing_rate, disposal_rate]
  unit: share
  constraints:
    - "0 <= recycling_rate, remanufacturing_rate, disposal_rate <= 1"
    - "recycling_rate + remanufacturing_rate + disposal_rate = 1 per (year, material, region)"

# Eligibility gate for remanufacturing by end-use.
# Effective reman path is multiplied by `value` in [0,1].
remanufacturing_end_use_eligibility:
  path: data/exogenous/remanufacturing_end_use_eligibility.csv
  required: true
  columns: [year, region, end_use, value]
  unit: share
  constraints:
    - "0 <= value <= 1"
  notes:
    - "High-level end-use eligibility factor for remanufacturing."
    - "Applied as a multiplicative gate on remanufacturing routing; non-eligible share is rerouted to recycling/disposal."

# Lifetime parameters in long format.
# Runtime pivots by `(dist, param)` when building cohort lifetimes.
lifetime_distributions:
  path: data/exogenous/lifetime_distributions.csv
  required: true
  columns: [cohort_year, material, region, end_use, dist, param, value]
  unit: years
  notes:
    - "Long format: one row per parameter; pivoted in code."

# Optional service-activity driver for demand transformation.
service_activity:
  path: data/exogenous/service_activity.csv
  required: false
  columns: [year, material, region, value]
  unit: index
  notes:
    - "Optional demand-transformation driver."
    - "Recommended normalization baseline is first modeled year = 1."

# Optional material-intensity driver for demand transformation.
material_intensity:
  path: data/exogenous/material_intensity.csv
  required: false
  columns: [year, material, region, value]
  unit: index
  notes:
    - "Optional demand-transformation driver (material intensity per unit service)."
    - "Recommended normalization baseline is first modeled year = 1."

# Optional observed stock for calibration metrics only.
stock_in_use:
  path: data/exogenous/stock_in_use.csv
  required: false
  columns: [year, material, region, end_use, value]
  unit: t
  notes:
    - "Calibration-only observations for fit metrics; not used to drive MFA."

# Optional observed OD matrix for calibration/backtesting.
trade_od_observed:
  path: data/exogenous/trade_od/baci_od_flow_observed.csv
  required: false
  columns: [year, material, commodity, origin_region, destination_region, flow_kt]
  unit: t_per_year
  notes:
    - "Observed OD matrix from BACI aggregation."
    - "Calibration/backtesting only; not required by endogenous runtime."

# OD preference weights used by allocator.
# Guardrail: sum_d weight_0_1 = 1 for each (year, material, commodity, origin_region).
trade_od_weights:
  path: data/exogenous/trade_od/baci_od_weights_rolling3.csv
  required: false
  columns: [year, material, commodity, origin_region, destination_region, weight_0_1]
  unit: share
  constraints:
    - "sum_d weight_0_1 = 1 per (year, material, commodity, origin_region)"

# Optional OD constraints input for calibration/backtesting tooling.
trade_od_constraints:
  path: data/exogenous/trade_od/baci_od_constraints_inputs.csv
  required: false
  columns:
    - year
    - material
    - commodity
    - region
    - supply_avail_kt
    - import_need_kt
    - export_cap_raw_kt
    - exportable_kt
  unit: t_per_year
  notes:
    - "OD constraint inputs used by the constrained allocator."
    - "Calibration/backtesting helper; endogenous runtime builds constraints in-loop."

# Optional governance-risk proxy by supplier origin.
supplier_governance_risk:
  path: data/exogenous/supplier_governance_risk.csv
  required: false
  columns: [year, origin_region, value]
  unit: index_0_1
  constraints:
    - "0 <= value <= 1"
  notes:
    - "Optional supplier governance-risk proxy for WGI-style concentration indices."
    - "origin_region values should align with OD supplier origins (EU27, China, RoW)."
